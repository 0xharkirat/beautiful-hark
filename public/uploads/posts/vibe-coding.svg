<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="50%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FDF2F8"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  
  <!-- Decorative code brackets -->
  <g opacity="0.1">
    <text x="50" y="100" font-family="monospace" font-size="180" fill="#DC2626" font-weight="bold">&lt;</text>
    <text x="1100" y="550" font-family="monospace" font-size="180" fill="#DC2626" font-weight="bold">/&gt;</text>
  </g>
  
  <!-- Code blocks background pattern -->
  <g opacity="0.15">
    <rect x="100" y="450" width="200" height="8" rx="4" fill="#DC2626"/>
    <rect x="100" y="475" width="300" height="8" rx="4" fill="#F97316"/>
    <rect x="100" y="500" width="250" height="8" rx="4" fill="#EC4899"/>
    
    <rect x="900" y="150" width="200" height="8" rx="4" fill="#DC2626"/>
    <rect x="900" y="175" width="150" height="8" rx="4" fill="#F97316"/>
    <rect x="900" y="200" width="180" height="8" rx="4" fill="#EC4899"/>
  </g>
  
  <!-- Central content -->
  <g>
    <!-- Main icon/symbol -->
    <circle cx="600" cy="250" r="100" fill="#DC2626" opacity="0.9"/>
    <text x="600" y="285" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="white" text-anchor="middle">⚡</text>
  </g>
  
  <!-- Title text -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#text-gradient)" text-anchor="middle">Vibe Coding</text>
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="32" fill="#6B7280" text-anchor="middle">with GitHub Copilot &amp; TinaCMS</text>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="200" r="30" fill="#DC2626" opacity="0.2"/>
  <circle cx="1000" cy="400" r="40" fill="#F97316" opacity="0.2"/>
  <circle cx="300" cy="500" r="25" fill="#EC4899" opacity="0.2"/>
  
  <!-- Meta/recursive visual hint -->
  <g opacity="0.3">
    <rect x="750" y="500" width="400" height="100" rx="8" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="10,5"/>
    <rect x="770" y="520" width="360" height="60" rx="6" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="8,4"/>
  </g>
</svg>
