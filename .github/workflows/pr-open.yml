name: Build Pull request
on:
  pull_request:
    types: [opened, synchronize, reopened]
env:
  # tina/config.ts reads PUBLIC_TINA_CLIENT_ID and GITHUB_BRANCH. The
  # NEXT_PUBLIC_* names are Next.js-era and are not read by anything now.
  # Fall back to the old secret name so this keeps working whether or not
  # the repository secret has been renamed alongside the Vercel variable.
  PUBLIC_TINA_CLIENT_ID: ${{ secrets.PUBLIC_TINA_CLIENT_ID || secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
  TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
  GITHUB_BRANCH: ${{ github.head_ref }}
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build sample
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          # 10, not 9: pnpm-workspace.yaml carries onlyBuiltDependencies, which
          # is pnpm 10+ syntax. Under 9 that file is ignored and better-sqlite3
          # and sharp silently skip their build scripts.
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      # After the build, not before: astro check needs tina/__generated__,
      # which is gitignored and written by `tinacms build`. Without this step
      # type errors reach main unnoticed, because `astro build` does not
      # typecheck - that is how a dangling type export shipped once already.
      - name: Typecheck
        run: pnpm exec astro check