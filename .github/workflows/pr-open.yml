name: Build Pull request
on:
  pull_request:
    types: [opened, synchronize, reopened]
env:
  # tina/config.ts reads GITHUB_BRANCH so the editor points at this branch.
  #
  # The TinaCloud credentials that used to live here are gone on purpose. This
  # job now builds with `build:local`, which needs none, and that is what makes
  # the job run identically on a Dependabot branch: GitHub deliberately keeps
  # Actions secrets away from Dependabot runs, so any job that needs them fails
  # there. The four Dependabot PRs were red for exactly this reason.
  #
  # Nothing is lost by dropping them. Vercel still builds every pull request
  # with the real credentials, so the cloud-checked build still happens; it just
  # happens somewhere that is supposed to hold secrets. This job's job is to
  # prove the code compiles.
  GITHUB_BRANCH: ${{ github.head_ref }}

# Least privilege. The default token is read/write across many scopes; this job
# only ever reads the tree.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build sample
    steps:
      # Actions are pinned to commit SHAs, not tags.
      #
      # A tag is mutable and the author can repoint it at any commit. That is
      # not hypothetical: the tj-actions/changed-files compromise in March 2025
      # worked by moving tags to a malicious commit, and it leaked secrets out
      # of thousands of repositories that had pinned to a tag exactly like this
      # file used to. The trailing comment is the human-readable version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      # No version here on purpose. It reads packageManager from package.json,
      # so CI and local can never drift. They already had: this pinned 10, the
      # Dependabot workflow pinned 9, and local was 11.9.0.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # --frozen-lockfile, so a lockfile that does not match package.json fails
      # the build instead of being quietly rewritten to something nobody
      # reviewed. Without it, CI is free to resolve versions the lockfile never
      # pinned, which defeats the point of committing one.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:local

      # After the build, not before: astro check needs tina/__generated__,
      # which is gitignored and written by the tina build. Without this step
      # type errors reach main unnoticed, because `astro build` does not
      # typecheck - that is how a dangling type export shipped once already.
      - name: Typecheck
        run: pnpm exec astro check
