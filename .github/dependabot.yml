# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "tinacms"
      - dependency-name: "@tinacms*"

  # Actions are pinned to commit SHAs in the workflows, which is what stops a
  # maintainer repointing a tag at malicious code. This is the other half of
  # that: Dependabot rewrites the pinned SHA and the trailing version comment,
  # so updates arrive as a reviewable pull request rather than silently.
  #
  # Without this entry, SHA pinning would mean the actions simply never update,
  # which is how a pinned action quietly rots into a version with a known CVE.
  #
  # Weekly, not daily. Actions change far less often than npm packages and a
  # daily cadence here is just noise.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
